<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Rain</title>
    <style>
      :root {
        --matrix-green: #28ff00;
        --background: #000;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--background);
      }

      body {
        position: relative;
        font-family: monospace;
      }

      canvas {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        display: block;
      }
      #controls {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border: 1px solid var(--matrix-green);
        background: rgba(0, 0, 0, 0.85);
        color: var(--matrix-green);
        z-index: 10;
      }

      button {
        padding: 0.6rem 1rem;
        border: 1px solid var(--matrix-green);
        border-radius: 4px;
        background: #000;
        color: var(--matrix-green);
        font: inherit;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition:
          background-color 150ms ease,
          color 150ms ease,
          box-shadow 150ms ease;
      }

      button:hover {
        background: var(--matrix-green);
        color: #000;

        box-shadow:
          0 0 10px var(--matrix-green),
          0 0 20px var(--matrix-green);
      }

      button:focus-visible {
        outline: 2px solid var(--matrix-green);
        outline-offset: 3px;
      }
      #speedControl {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #speed {
        width: 120px;

        accent-color: var(--matrix-green);

        cursor: pointer;
      }

      #speedValue {
        min-width: 35px;
        text-align: right;
      }

      #startButton {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 1rem 2rem;
        border: 1px solid var(--matrix-green);
        border-radius: 4px;
        background: #000;
        color: var(--matrix-green);
        font: inherit;
        font-size: 1.25rem;
        letter-spacing: 0.15em;
        cursor: pointer;
        z-index: 20;
        transition:
          background-color 150ms ease,
          color 150ms ease,
          box-shadow 150ms ease;
      }

      #startButton:hover {
        background: var(--matrix-green);
        color: #000;
        box-shadow:
          0 0 10px var(--matrix-green),
          0 0 30px var(--matrix-green);
      }

      #startButton.hidden {
        display: none;
      }

      @media (max-width: 480px) {
        #controls {
          width: calc(100% - 20px);

          justify-content: center;

          font-size: 0.8rem;
        }

        #speed {
          width: 90px;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="matrix"></canvas>

    <div id="controls">
      <button id="stopButton" type="button">STOP</button>

      <div id="speedControl">
        <label for="speed"> SPEED </label>

        <input
          id="speed"
          type="range"
          min="0.1"
          max="10"
          step="0.1"
          value="1"
        />

        <span id="speedValue"> 1.0 </span>
      </div>
    </div>

    <button id="startButton" type="button" aria-label="Start Matrix Rain">
      START
    </button>

    <script>
      "use strict";
      const canvas = document.getElementById("matrix");
      const context = canvas.getContext("2d");
      const startButton = document.getElementById("startButton");
      const stopButton = document.getElementById("stopButton");
      const speedInput = document.getElementById("speed");
      const speedValue = document.getElementById("speedValue");

      // Matrix characters
      const chars =
        "0123456789" +
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "abcdefghijklmnopqrstuvwxyz" +
        "!@#$%^&*()_+-=[]{}<>?/\\|" +
        "アイウエオカキクケコサシスセソ" +
        "タチツテトナニヌネノハヒフヘホ" +
        "マミムメモヤユヨラリルレロワヲン" +
        "ァィゥェォャュョッ" +
        "あいうえおかきくけこさしすせそ" +
        "たちつてとなにぬねのはひふへほ" +
        "まみむめもやゆよらりるれろわをん" +
        "αβγδεζηθικλμνξοπρστυφχψω" +
        "ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ" +
        "АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ" +
        "абвгдежзийклмнопрстуфхцчшщъыьэюя" +
        "ابتثجحخدذرزسشصضطظعغفقكلمنهوي" +
        "가나다라마바사아자차카타파하" +
        "∑∏√∞≈≠≤≥∫∆∇∂µπΩ" +
        "±∓×÷∝∀∃∈∉⊂⊃⊆⊇" +
        "※〒〆〇○●◎◇◆□■△▲▽▼☆★" +
        "░▒▓█▀▄▌▐" +
        "┌┐└┘├┤┬┴┼─│" +
        "ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛋᛏ" +
        "⠁⠃⠇⠉⠙⠑⠓⠕⠗⠞⠺⠵";

      // Configuration
      const fontSize = 16;
      let columns;
      let drops;
      let animationId = null;
      let running = false;

      /*
       * Velocidad de caída.
       *
       * 1.0 = velocidad original
       * 2.0 = doble de velocidad
       * 0.5 = mitad de velocidad
       * 10  = muy rápido
       */
      let fallSpeed = 1;

      // Canvas
      function resizeCanvas() {
        const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * devicePixelRatio;
        canvas.height = window.innerHeight * devicePixelRatio;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        columns = Math.ceil(window.innerWidth / fontSize);
        drops = Array.from({ length: columns }, () => Math.random() * -100);
      }

      // Matrix Rain
      function draw() {
        if (!running) {
          return;
        }

        const width = window.innerWidth;
        const height = window.innerHeight;

        // Fading effect.
        context.fillStyle = "rgba(0, 0, 0, 0.05)";
        context.fillRect(0, 0, width, height);
        context.font = `${fontSize}px monospace`;
        context.textBaseline = "top";
        for (let i = 0; i < drops.length; i++) {
          const char = chars[Math.floor(Math.random() * chars.length)];
          const x = i * fontSize;
          const y = drops[i] * fontSize;

          // Main character
          context.fillStyle = "#28ff00";
          context.fillText(char, x, y);

          // speed control
          drops[i] += fallSpeed;

          // Restart column
          if (y > height && Math.random() > 0.975) {
            drops[i] = Math.random() * -20;
          }
        }

        animationId = requestAnimationFrame(draw);
      }

      // Start
      function start() {
        if (running) {
          return;
        }
        running = true;
        startButton.classList.add("hidden");
        resizeCanvas();
        animationId = requestAnimationFrame(draw);
      }

      // Stop
      function stop() {
        if (!running) {
          return;
        }
        running = false;
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      // Speed
      function updateSpeed() {
        fallSpeed = Number(speedInput.value);
        speedValue.textContent = fallSpeed.toFixed(1);
      }

      // Events
      startButton.addEventListener("click", start);
      stopButton.addEventListener("click", stop);
      speedInput.addEventListener("input", updateSpeed);
      window.addEventListener("resize", () => {
        if (!running) {
          resizeCanvas();
          return;
        }
        cancelAnimationFrame(animationId);
        resizeCanvas();
        animationId = requestAnimationFrame(draw);
      });

      // Initial setup
      resizeCanvas();
      updateSpeed();
    </script>
  </body>
</html>
